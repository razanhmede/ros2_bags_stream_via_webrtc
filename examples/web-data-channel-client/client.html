<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Web Data Channel Client (Direct-to-Client)</title>
    <script src="./openteraWebrtcWebClient.js"></script>
    <script>
      const HOST = location.hostname;
      const WS_PROTO = (location.protocol === 'https:') ? 'wss' : 'ws';
      window.SIGNALING_URL = `ws://424-iwhub.idealworks.com:8081/signaling`;
      const ICE_SERVERS_URL = './iceServers.json';
      const TOPIC_CMD = "/dev_web_ui/cmd_vel";
      const TOPIC_CONNECT = "/dev_web_ui/connect";
      const SENDER_NAME = "dev_web_ui";
      const LIN_SPEED = 2, ANG_SPEED = 1.0, RATE_HZ = 20;
      const periodMs = Math.max(10, 1000 / RATE_HZ);
      window.keys = { w:0, a:0, s:0, d:0 };
      let wasdTimer = null;
      let lastKeepalive = 0;

      function anyKeyDown(){ return keys.w || keys.a || keys.s || keys.d; }
      function computeCmd(){
        const vx = (keys.w - keys.s) * LIN_SPEED;
        const wz = (keys.a - keys.d) * ANG_SPEED;
        return { vx, vy: 0, wz };
      }
      function dc(){
        return (window.__dc && window.__dc.readyState === 'open') ? window.__dc : null;
      }
      function dcSend(obj){
        const ch = dc(); if (!ch) return;
        const str = (typeof obj === 'string') ? obj : JSON.stringify(obj);
        ch.send(str);
        const out = document.getElementById('last_sent'); if (out) out.textContent = str;
      }
      function twist(x=0, y=0, z=0){
        return { op:"publish", topic:TOPIC_CMD, type:"geometry_msgs/msg/Twist", msg:{ linear:{x,y,z:0}, angular:{x:0,y:0,z:z} } };
      }
      function msgConnect(connected){
        return { op:"publish", topic:TOPIC_CONNECT, type:"std_msgs/msg/Bool", msg:!!connected };
      }
      function tick(){
        const now = Date.now();
        if (now - lastKeepalive > 1000) {
          dcSend(msgConnect(true));
          lastKeepalive = now;
        }
        const { vx, vy, wz } = computeCmd();
        dcSend(twist(vx, vy, wz));
      }
      function startLoop(){ if (!wasdTimer) wasdTimer = setInterval(tick, periodMs); }
      function stopLoop(){
        if (!wasdTimer) return;
        clearInterval(wasdTimer); wasdTimer = null;
        dcSend(twist(0,0,0));
        dcSend(msgConnect(false));
      }
      async function loadIceServers() {
        try {
          const res = await fetch(ICE_SERVERS_URL, { cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
          const iceServers = await res.json();
          if (!Array.isArray(iceServers)) throw new Error('iceServers.json must be a JSON array.');
          return iceServers;
        } catch (err) {
          return [];
        }
      }
      function wireClientUI(client){
        const nameInput = document.getElementById('name_input');
        const passwordInput = document.getElementById('password_input');
        const connectButton = document.getElementById('connect_button');
        const closeButton = document.getElementById('close_button');
        const clientList = document.getElementById('client_list');
        const callAllButton = document.getElementById('call_all_button');
        const hangUpAllButton = document.getElementById('hang_up_all_button');
        const closeAllRoomPeerConnectionsButton = document.getElementById('close_all_room_peer_connections');
        const idInput = document.getElementById('id_input');
        const callOneButton = document.getElementById('call_one_button');
        const textInput = document.getElementById('text_input');
        const sendButton = document.getElementById('send_button');
        const chatTextArea = document.getElementById('chat_text_area');
        const dcStatus = document.getElementById('dc_status');
        const enableEl = document.getElementById('wasd_enable');

        function updateDcStatus(){
          dcStatus.textContent = (window.__dc ? window.__dc.readyState : 'none');
        }
        client.onSignalingConnectionOpen = () => { connectButton.disabled = true; closeButton.disabled = false; };
        client.onSignalingConnectionClose = () => {
          connectButton.disabled = false; closeButton.disabled = true;
          callAllButton.disabled = true; hangUpAllButton.disabled = true; closeAllRoomPeerConnectionsButton.disabled = true; callOneButton.disabled = true;
          stopLoop();
        };
        client.onSignalingConnectionError = (message) => { alert(message); };
        client.onRoomClientsChange = (clients) => {
          callAllButton.disabled = !(clients.length > 1 && hangUpAllButton.disabled);
          callOneButton.disabled = callAllButton.disabled;
          clientList.innerHTML = '';
          clients.forEach((c) => {
            const li = document.createElement('li');
            li.textContent = c.id + ' - ' + c.name;
            li.style.color = c.isConnected ? 'green' : 'red';
            clientList.appendChild(li);
          });
        };
        client.callAcceptor = async (id, name) => confirm('Do you accept the call from ' + name + '?');
        client.onCallReject = (id, name) => { alert('The call is rejected (' + name + ')'); };
        client.onClientConnectionFail = (id, name) => { };
        client.onDataChannelOpen = () => {
          sendButton.disabled = false;
          callAllButton.disabled = true; hangUpAllButton.disabled = false; closeAllRoomPeerConnectionsButton.disabled = false; callOneButton.disabled = true;
          updateDcStatus();
          if (enableEl.checked) { lastKeepalive = 0; startLoop(); }
        };
        client.onDataChannelClose = () => {
          sendButton.disabled = !client.isRtcConnected;
          callAllButton.disabled = client.isRtcConnected; hangUpAllButton.disabled = !client.isRtcConnected; closeAllRoomPeerConnectionsButton.disabled = !client.isRtcConnected; callOneButton.disabled = client.isRtcConnected;
          updateDcStatus();
          stopLoop();
        };
        client.onDataChannelMessage = (id, name, _data, message) => {
          chatTextArea.value += `${id} - ${name}: ${message}\n`;
          chatTextArea.scrollTop = chatTextArea.scrollHeight;
        };
        (function hookAllDataChannels() {
          function attach(dc){
            window.__dc = dc;
            const _send = dc.send.bind(dc);
            dc.send = (data)=>{ try { JSON.parse(data); } catch {} _send(data); };
            dc.addEventListener('message', ev => {});
            dc.onopen  = updateDcStatus;
            dc.onclose = updateDcStatus;
            updateDcStatus();
          }
          const origCreate = RTCPeerConnection.prototype.createDataChannel;
          RTCPeerConnection.prototype.createDataChannel = function(label, opts){
            const dc = origCreate.call(this, label, opts);
            attach(dc);
            return dc;
          };
          const desc = Object.getOwnPropertyDescriptor(RTCPeerConnection.prototype, 'ondatachannel');
          Object.defineProperty(RTCPeerConnection.prototype, 'ondatachannel', {
            set(fn){ return desc.set.call(this, ev => { attach(ev.channel); fn && fn(ev); }); }
          });
        })();
        connectButton.onclick = async () => { try { await client.connect(); } catch (err) { alert('Failed to connect to signaling server.\n' + err.message); } };
        closeButton.onclick = () => { try { client?.close(); } finally { clientList.innerHTML = ''; } };
        callAllButton.onclick = () => client?.callAll && client.callAll();
        hangUpAllButton.onclick = () => client?.hangUpAll && client.hangUpAll();
        closeAllRoomPeerConnectionsButton.onclick = () => client?.closeAllRoomPeerConnections && client.closeAllRoomPeerConnections();
        callOneButton.onclick = () => { const id = (idInput.value || '').trim(); if (id && client?.callIds) client.callIds([id]); };
        sendButton.onclick = () => {
          const m = textInput.value || '';
          if (!m) return;
          const ch = dc();
          if (ch) ch.send(m);
          chatTextArea.value += 'Me: ' + m + '\n';
          chatTextArea.scrollTop = chatTextArea.scrollHeight;
        };
        enableEl.addEventListener('change', () => {
          if (enableEl.checked) { lastKeepalive = 0; startLoop(); }
          else { stopLoop(); }
        });
        window.addEventListener('keydown', (e) => {
          if (!enableEl.checked) return;
          const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
          if (tag === 'input' || tag === 'textarea' || e.target?.isContentEditable) return;
          const k = e.key.toLowerCase();
          if (!(k in keys) || e.repeat) return;
          keys[k] = 1; e.preventDefault();
          if (wasdTimer === null) startLoop();
        }, true);
        window.addEventListener('keyup', (e) => {
          if (!enableEl.checked) return;
          const k = e.key.toLowerCase();
          if (!(k in keys)) return;
          keys[k] = 0; e.preventDefault();
        }, true);
        window.addEventListener('beforeunload', () => {
          try { dcSend(twist(0,0,0)); dcSend(msgConnect(false)); } catch {}
        });
        window.pressKey = function pressKey(k){
          if (!document.getElementById('wasd_enable').checked) return;
          keys[k] = 1; tick();
          setTimeout(() => { keys[k] = 0; }, 120);
        };
        closeButton.disabled = true;
        callAllButton.disabled = true;
        hangUpAllButton.disabled = true;
        closeAllRoomPeerConnectionsButton.disabled = true;
        callOneButton.disabled = true;
        sendButton.disabled = true;
        document.getElementById('chat_text_area').value = '';
      }
      window.addEventListener('DOMContentLoaded', async () => {
        if (!window.openteraWebrtcWebClient) {
          alert('OpenTera client library not found.');
          return;
        }
        const iceServers = await loadIceServers();
        const nameInput = document.getElementById('name_input');
        const passwordInput = document.getElementById('password_input');
        const SignalingServerConfiguration = {
          url: window.SIGNALING_URL,
          name: nameInput.value || 'web',
          data: {},
          room: 'chat',
          password: passwordInput.value || ''
        };
        const DataChannelConfiguration = {};
        const RtcConfiguration = { iceServers, iceTransportPolicy: 'relay' };
        const logger = (...args) => {};
        const client = new window.openteraWebrtcWebClient.DataChannelClient(
          SignalingServerConfiguration,
          DataChannelConfiguration,
          RtcConfiguration,
          logger
        );
        wireClientUI(client);
      });
    </script>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; }
      .row { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; margin:.5rem 0; }
      .keys { display:grid; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(2,48px); gap:6px; user-select:none; }
      .key  { display:flex; align-items:center; justify-content:center; width:48px; height:48px; border:1px solid #bbb; border-radius:8px; background:#f7f7f7; cursor:pointer; font-weight:600; }
      .key[data-k="w"]{grid-column:2;grid-row:1}
      .key[data-k="a"]{grid-column:1;grid-row:2}
      .key[data-k="s"]{grid-column:2;grid-row:2}
      .key[data-k="d"]{grid-column:3;grid-row:2}
      .status { font-size:12px; color:#555; }
      .pill   { padding:.1rem .4rem; border-radius:999px; background:#f6f8fa; }
      pre     { background:#f6f8fa; padding:.5rem; border-radius:6px; width:520px; min-height:2rem; }
      textarea { width: 520px; }
    </style>
  </head>
  <body>
    <h1>Web Data Channel Client</h1>
    <div class="row">
      <label>Name: <input id="name_input" type="text" /></label>
      <label>Password: <input id="password_input" type="text" value="abc" /></label>
      <div class="keys" title="Click or press keyboard">
        <div class="key" data-k="w" onclick="pressKey('w')">W</div>
        <div class="key" data-k="a" onclick="pressKey('a')">A</div>
        <div class="key" data-k="s" onclick="pressKey('s')">S</div>
        <div class="key" data-k="d" onclick="pressKey('d')">D</div>
      </div>
      <label><input id="wasd_enable" type="checkbox" /> Enable WASD</label>
      <span class="status">DataChannel: <span id="dc_status" class="pill">none</span></span>
    </div>
    <div class="row">
      <button id="connect_button" type="button">Connect</button>
      <button id="close_button"   type="button">Close</button>
    </div>
    <h4>Clients:</h4>
    <ul id="client_list"></ul>
    <div class="row">
      <button id="call_all_button" type="button">Call All</button>
      <button id="hang_up_all_button" type="button">Hang Up All</button>
      <button id="close_all_room_peer_connections" type="button">Close All Room Peer Connections</button>
    </div>
    <h4>Call One:</h4>
    <div class="row">
      <input id="id_input" type="text" />
      <button id="call_one_button" type="button">Call</button>
    </div>
    <h4>Messages (manual send):</h4>
    <div class="row">
      <input id="text_input" type="text" />
      <button id="send_button" type="button">Send</button>
    </div>
    <textarea id="chat_text_area" rows="10" cols="50" readonly></textarea>
    <h4>Last WASD message sent:</h4>
    <pre id="last_sent"></pre>
  </body>
</html>
